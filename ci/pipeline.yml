# FoundryX CI — SwiftUI iOS app on the Grain design system.
#
# Register (local Concourse):
#   fly -t local set-pipeline -p foundryx -c ci/pipeline.yml -l ci/vars.yml
#
# FoundryX has two sibling SwiftPM path dependencies:
#   ../grain/platforms/grain-swift          (Grain design system)
#   ../brine-private/runners/.../swift      (Brine test runner)
# Concourse checks these out as separate inputs; the tasks symlink them into the
# sibling layout the package manifest expects, then build/test.
#
# Secrets (((…))) resolve from the Concourse credential manager:
#   ((github-access-token))  — repo read access (incl. grain + brine-private)
#   ((asc-key-id)) ((asc-issuer-id)) ((asc-key-p8))  — App Store Connect API key

groups:
  - name: ci
    jobs:
      - test
  - name: release
    jobs:
      - testflight
  - name: infra
    jobs:
      - set-pipeline

resources:
  - name: foundryx-repo
    type: git
    icon: github
    source:
      uri: ((git-uri))
      branch: main
      username: x-access-token
      password: ((github-access-token))

  - name: foundryx-repo-tags
    type: git
    icon: tag
    source:
      uri: ((git-uri))
      username: x-access-token
      password: ((github-access-token))
      tag_filter: "v*"

  - name: grain-repo
    type: git
    icon: palette
    source:
      uri: ((grain-git-uri))
      branch: main
      username: x-access-token
      password: ((github-access-token))

  - name: brine-private-repo
    type: git
    icon: test-tube
    source:
      uri: ((brine-git-uri))
      branch: main
      username: x-access-token
      password: ((github-access-token))

jobs:
  # ── infra: keep the pipeline self-updating ──────────────────────────
  - name: set-pipeline
    plan:
      - get: foundryx-repo
        trigger: true
      - set_pipeline: foundryx
        file: foundryx-repo/ci/pipeline.yml
        var_files:
          - foundryx-repo/ci/vars.yml

  # ── ci: build + Brine tests on a macOS worker. Re-runs when grain or
  #        brine-private change too, so the path deps stay green. ───────
  - name: test
    plan:
      - in_parallel:
          - get: foundryx-repo
            trigger: true
          - get: grain-repo
            trigger: true
          - get: brine-private-repo
            trigger: true
      - task: swift-build-test
        tags: [macos]
        config:
          platform: darwin
          inputs:
            - name: foundryx-repo
            - name: grain-repo
            - name: brine-private-repo
          run:
            path: /bin/bash
            args:
              - -ec
              - |
                export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
                # Recreate the sibling layout the SwiftPM manifest expects.
                ln -sfn "$PWD/grain-repo" grain
                ln -sfn "$PWD/brine-private-repo" brine-private
                cd foundryx-repo
                swift build
                swift test

  # ── release: build + upload to TestFlight on a v* tag ───────────────
  - name: testflight
    serial: true
    plan:
      - in_parallel:
          - get: foundryx-repo-tags
            trigger: true
          - get: grain-repo
          - get: brine-private-repo
      - task: fastlane-beta
        tags: [macos]
        config:
          platform: darwin
          inputs:
            - name: foundryx-repo-tags
            - name: grain-repo
            - name: brine-private-repo
          params:
            ASC_KEY_ID: ((asc-key-id))
            ASC_ISSUER_ID: ((asc-issuer-id))
            ASC_KEY_P8: ((asc-key-p8))
          run:
            path: /bin/bash
            args:
              - -ec
              - |
                export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
                ln -sfn "$PWD/grain-repo" grain
                ln -sfn "$PWD/brine-private-repo" brine-private
                # Materialize the App Store Connect API key file.
                mkdir -p "$PWD/asc"
                printf '%s' "$ASC_KEY_P8" > "$PWD/asc/AuthKey_${ASC_KEY_ID}.p8"
                export ASC_KEY_PATH="$PWD/asc/AuthKey_${ASC_KEY_ID}.p8"
                export BUILD_NUMBER="$(cd foundryx-repo-tags && git rev-list --count HEAD)"
                cd foundryx-repo-tags
                bundle install
                bundle exec fastlane beta
