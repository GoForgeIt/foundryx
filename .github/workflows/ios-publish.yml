# ios-publish — the GitHub Actions port of Concourse's foundryx-ios-publish.
# Migrated 2026-08-12 per foundry-business-hearth proposal
# 20260812T2204_github_actions_ci_migration.
#
# TOPOLOGY. Every job runs on the SELF-HOSTED Mac mini runner (labels
# [self-hosted, macOS, ios]) — zero paid Actions minutes, and source/secrets/
# artifacts never leave hardware we control. iOS signing material comes from
# repo secrets; the keychain is never touched (rcodesign, not codesign — the
# host's system codesign is broken on macOS 26.6).
#
# GATE PARITY with the Concourse pipeline this replaces:
#   * the three test tasks became three JOBS chained with `needs:` — a red
#     names itself in the UI, reruns independently, and stops the chain
#     (Concourse's single ci-gates task ran 45 min to report a 6-min failure)
#   * `concurrency: macos-build` replaces the macos-build-lock pool resource.
#     Native, and it CANNOT be orphaned by a dead build — the pool lock was
#     left claimed by a disk-killed build on 2026-08-12 and stalled every
#     deploy behind it for 70 minutes.
#   * ship still verifies INSTALLABLE (VALID IN_BETA_TESTING), not merely
#     "UPLOAD SUCCEEDED" — that distinction cost hours on 2026-07-31.
name: ios-publish

on:
  push:
    branches: [main]
  # WHY A SHIP CAN GO MISSING WITHOUT ANYTHING TURNING RED.
  #
  # GitHub honours the skip-ci tag in the HEAD commit message, so a merge whose
  # TIP commit is CI-only creates no run at all. On 2026-08-15 seven gates
  # passed, `2592706..20d94fe HEAD -> main` succeeded, and no ship existed —
  # because the tip was a gate fix carrying that tag. Then the follow-up commit,
  # whose whole subject was ABOUT the tag, contained the literal string and was
  # skipped for the same reason. A silently-absent run reads exactly like a
  # successful ship, which is far harder to notice than a red one.
  #
  # The tag is right in foundry (CI-only commits should not burn self-hosted
  # runner time) and wrong here, where it suppresses the deliverable. So: keep
  # the tag out of the TIP commit when main should ship, and when in doubt ask
  # for a run rather than inventing an empty commit.
  #
  # `workflow_dispatch` below was ALREADY HERE — it always was. Both silent
  # no-ships were avoidable by dispatching. Adding a second one made the file
  # unparseable to GitHub ("workflow_dispatch is already defined", HTTP 422)
  # while PyYAML's safe_load accepted it, silently keeping the last key — a
  # local "YAML OK" on a file GitHub refuses. Validate workflows with a loader
  # that REJECTS duplicate keys.
  workflow_dispatch: {}

concurrency:
  group: macos-build
  cancel-in-progress: false

jobs:
  unit-and-invariant-suites:
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 90
    steps:
      # ── THE MACHINE-WIDE MAC BUILD SLOT ─────────────────────────────────────
      # `concurrency: macos-build` is scoped to ONE repository; eight
      # repositories declare that same group and it serialises nothing between
      # them. ci/mac-slot.sh is the bound that is machine-wide — a lock
      # directory under /Users/Shared that every runner on this Mac shares. Its
      # executed proof (10 contenders, 2 slots, plus a lockless red control
      # that peaks at 10) is foundry's ci/mac-slot.selftest.sh.
      #
      # This job is CPU-heavy end to end, so the slot spans the whole job. There
      # is no fall-through: if no slot frees inside the wait budget this step
      # fails and the build does not run.
      - uses: actions/checkout@v4
        with: { path: foundryx }
      - name: acquire the machine-wide mac build slot
        run: bash "$GITHUB_WORKSPACE/foundryx/ci/mac-slot.sh" acquire "foundryx-ios-publish/unit-and-invariant-suites"
      - uses: actions/checkout@v4
        with:
          repository: GoForgeIt/forge-design-system
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: grain
      - uses: actions/checkout@v4
        with:
          repository: MarkDucommun/brine-private
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: brine-private
      - uses: actions/checkout@v4
        with:
          repository: GoForgeIt/foundry
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: foundry
          # PINNED — see ci/foundry-relay-ref.txt. An unpinned checkout builds
          # another repo's moving HEAD; foundry main moved four times on
          # 2026-08-14 and red-lit every ship here with no commit of ours.
          ref: 95b3d58ab1b2d6be9da428201a4bfc81eb8f53f6
      - name: prove the keychain is usable in this session
        run: |
          # The runners are Aqua-session LaunchAgents so they share the logged-in
          # user's UNLOCKED login keychain — the keychain-backed pairing suites
          # depend on it, and AccountDataIsolationFeatureTests has a guard test
          # that deliberately FAILS on macOS if the keychain is unusable (a host
          # where it is locked silently skips all pairing coverage). This probe
          # makes that host defect fail HERE, in one second, with its own name —
          # not 3 minutes in as a confusing pairing failure. First attempt at this
          # was `security unlock-keychain` with the Concourse keychain_password,
          # which is NOT the login keychain's password; session placement is the
          # real fix, no secret needed.
          cat > /tmp/kc-probe.swift <<'SW'
          import Security
          import Foundation
          let svc = "ci-probe.\(UUID().uuidString)"
          let add: [String: Any] = [kSecClass as String: kSecClassGenericPassword,
                                    kSecAttrService as String: svc,
                                    kSecValueData as String: Data("p".utf8)]
          let st = SecItemAdd(add as CFDictionary, nil)
          if st == errSecSuccess {
              SecItemDelete([kSecClass as String: kSecClassGenericPassword,
                             kSecAttrService as String: svc] as CFDictionary)
              print("keychain usable (SecItemAdd == 0)")
          } else {
              print("KEYCHAIN UNUSABLE: SecItemAdd == \(st). The runner is outside the")
              print("Aqua session (check LimitLoadToSessionType in its LaunchAgent plist)")
              exit(1)
          }
          SW
          swift /tmp/kc-probe.swift
      - name: relay + swift + gates
        # No inner duration knob anymore: ci-gates' deadlock detector now watches
        # OUTPUT PROGRESS (SWIFT_TEST_STALL, default 300s of byte-silence), so a
        # slow-but-writing run can never be misdiagnosed. Attempts 3 and 4 both
        # died to the old flat bound — one at 1187/1370 tests passing. The
        # job-level timeout-minutes above is the only duration guard.
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          # The T25 conformance target starts a REAL foundry-relay
          # ("Absent relay is a RED, never an XCTSkip").
          ( cd foundry && cargo build --release -p foundry-relay --bin foundry-relay )
          export FOUNDRYX_CONFORMANCE_RELAY_BIN="$PWD/foundry/target/release/foundry-relay"
          [ -x "$FOUNDRYX_CONFORMANCE_RELAY_BIN" ]
          # The P1/A9 conformance targets start the BLIND TUNNEL as a real process —
          # a different binary from the P3 relay (TunnelRelayFixture pins its shipped
          # identifier). Absent, every P1 predicate is a refusal: exactly how run
          # attempt 2 failed on 2026-08-12.
          ( cd foundry && cargo build --release -p foundryx-tunnel --bin foundryx-relay-server )
          export FOUNDRYX_CONFORMANCE_TUNNEL_BIN="$PWD/foundry/target/release/foundryx-relay-server"
          [ -x "$FOUNDRYX_CONFORMANCE_TUNNEL_BIN" ]
          cd foundryx
          swift build
          # The cheap phases, and the ones that actually go red — first and alone.
          bash scripts/ci-gates.sh swift gates
      # `if: always()`, so a failed or refused build hands its slot back at once
      # instead of waiting for its Runner.Worker pid to disappear.
      - name: release the machine-wide mac build slot
        if: always()
        run: bash "$GITHUB_WORKSPACE/foundryx/ci/mac-slot.sh" release

  app-compile-leak-lint:
    needs: unit-and-invariant-suites
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 90
    steps:
      # ── THE MACHINE-WIDE MAC BUILD SLOT ─────────────────────────────────────
      # `concurrency: macos-build` is scoped to ONE repository; eight
      # repositories declare that same group and it serialises nothing between
      # them. ci/mac-slot.sh is the bound that is machine-wide — a lock
      # directory under /Users/Shared that every runner on this Mac shares. Its
      # executed proof (10 contenders, 2 slots, plus a lockless red control
      # that peaks at 10) is foundry's ci/mac-slot.selftest.sh.
      #
      # This job is CPU-heavy end to end, so the slot spans the whole job. There
      # is no fall-through: if no slot frees inside the wait budget this step
      # fails and the build does not run.
      - uses: actions/checkout@v4
        with: { path: foundryx }
      - name: acquire the machine-wide mac build slot
        run: bash "$GITHUB_WORKSPACE/foundryx/ci/mac-slot.sh" acquire "foundryx-ios-publish/app-compile-leak-lint"
      - uses: actions/checkout@v4
        with:
          repository: GoForgeIt/forge-design-system
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: grain
      - uses: actions/checkout@v4
        with:
          repository: MarkDucommun/brine-private
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: brine-private
      - name: compile + leak + lint
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cd foundryx
          # compile: iOS app Debug AND Release + build-for-testing (caught main
          # shipping unbuildable while 960 package tests were green).
          # leak: no harness seam in the Release binary, with negative control.
          bash scripts/ci-gates.sh compile leak lint
      - name: stash sim test products for test-without-building
        run: |
          # ci-gates' compile phase already ran build-for-testing for the SIMULATOR
          # (destination generic/platform=iOS Simulator, derivedData build/ci-gates-dd).
          # Both runners live on this one Mac, so a host cache keyed by SHA hands the
          # products to the sim job without a multi-GB artifact upload. The sim job
          # then RUNS the tests instead of rebuilding the app a second time —
          # rebuilding was ~10 of its ~18 minutes.
          CACHE=~/.ci-cache/foundryx/${GITHUB_SHA}/Products
          rm -rf "$CACHE"; mkdir -p "$CACHE"
          cp -R foundryx/build/ci-gates-dd/Build/Products/. "$CACHE/"
          ls "$CACHE"/*.xctestrun >/dev/null
          echo "stashed $(du -sh "$CACHE" | cut -f1)"
          # keep only the 3 newest SHAs so the cache cannot become the next disk fill
          cd ~/.ci-cache/foundryx && ls -t | tail -n +4 | xargs rm -rf 2>/dev/null || true
      # `if: always()`, so a failed or refused build hands its slot back at once
      # instead of waiting for its Runner.Worker pid to disappear.
      - name: release the machine-wide mac build slot
        if: always()
        run: bash "$GITHUB_WORKSPACE/foundryx/ci/mac-slot.sh" release

  ios-simulator-brine:
    needs: app-compile-leak-lint
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 90
    steps:
      # ── THE MACHINE-WIDE MAC BUILD SLOT ─────────────────────────────────────
      # `concurrency: macos-build` is scoped to ONE repository; eight
      # repositories declare that same group and it serialises nothing between
      # them. ci/mac-slot.sh is the bound that is machine-wide — a lock
      # directory under /Users/Shared that every runner on this Mac shares. Its
      # executed proof (10 contenders, 2 slots, plus a lockless red control
      # that peaks at 10) is foundry's ci/mac-slot.selftest.sh.
      #
      # This job is CPU-heavy end to end, so the slot spans the whole job. There
      # is no fall-through: if no slot frees inside the wait budget this step
      # fails and the build does not run.
      - uses: actions/checkout@v4
        with: { path: foundryx }
      - name: acquire the machine-wide mac build slot
        run: bash "$GITHUB_WORKSPACE/foundryx/ci/mac-slot.sh" acquire "foundryx-ios-publish/ios-simulator-brine"
      - uses: actions/checkout@v4
        with:
          repository: GoForgeIt/forge-design-system
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: grain
      - uses: actions/checkout@v4
        with:
          repository: MarkDucommun/brine-private
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: brine-private
      - name: app-hosted scenarios — App/ executing inside the real app process
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd foundryx
          # THE LANE THAT SEES App/. FoundryXiOSTests is HOSTLESS and cannot import the app
          # module at all, so every scenario before this one proved the LOGIC in FoundryXKit
          # and nothing about whether the shipped app reaches it. Measured 2026-08-13:
          # 0 of 17 sampled scenario files drove a production entry point, and 18,441 lines
          # of App/ had zero executable coverage. Proven by mutation: deleting the caller in
          # App/DeviceScreen.swift turns this lane RED while the hostless pocket suites
          # report 12 tests, 0 failures.
          #
          # NAME DISCIPLINE: the pre-push hook derives its phase list from THIS FILE via
          # `grep -oE 'bash scripts/ci-gates\.sh [a-z ]+'`. A phase name with a hyphen or a
          # digit truncates and turns every push into "UNKNOWN PHASE -> exit 2".
          bash scripts/ci-gates.sh appscenarios
      - name: iOS runtime lane on simulator
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd foundryx
          SIM_ID="$(xcrun simctl list devices available \
                    | grep -iE 'iPhone' | grep -oE '[0-9A-F-]{36}' | head -1)"
          [ -n "$SIM_ID" ] || { echo 'no iOS simulator available' >&2; exit 1; }
          CACHE=~/.ci-cache/foundryx/${GITHUB_SHA}/Products
          RUN_FILE="$(ls -t "$CACHE"/FoundryX_*.xctestrun 2>/dev/null | head -1)"
          if [ -n "$RUN_FILE" ]; then
            # The compile job already built these exact products for this exact SHA.
            echo "==> test-without-building from $RUN_FILE"
            xcodebuild test-without-building -xctestrun "$RUN_FILE" \
              -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO
          else
            # Cold path (fresh runner, pruned cache): the original full build. A missing
            # stash must never fail the lane — only make it slower.
            echo "==> no stashed products; full build+test fallback"
            command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
            xcodegen generate
            xcodebuild test -project FoundryX.xcodeproj -scheme FoundryX \
              -destination "id=$SIM_ID" CODE_SIGNING_ALLOWED=NO
          fi
      # `if: always()`, so a failed or refused build hands its slot back at once
      # instead of waiting for its Runner.Worker pid to disappear.
      - name: release the machine-wide mac build slot
        if: always()
        run: bash "$GITHUB_WORKSPACE/foundryx/ci/mac-slot.sh" release

  build-sign-ship:
    needs: ios-simulator-brine
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 90
    steps:
      # ── THE MACHINE-WIDE MAC BUILD SLOT ─────────────────────────────────────
      # `concurrency: macos-build` is scoped to ONE repository; eight
      # repositories declare that same group and it serialises nothing between
      # them. ci/mac-slot.sh is the bound that is machine-wide — a lock
      # directory under /Users/Shared that every runner on this Mac shares. Its
      # executed proof (10 contenders, 2 slots, plus a lockless red control
      # that peaks at 10) is foundry's ci/mac-slot.selftest.sh.
      #
      # This job is CPU-heavy end to end, so the slot spans the whole job. There
      # is no fall-through: if no slot frees inside the wait budget this step
      # fails and the build does not run.
      # The ship script is VERBATIM from Concourse and expects these exact
      # sibling dir names.
      - uses: actions/checkout@v4
        with: { path: foundryx-source }
      # AFTER the checkout, and pointed at THIS job's directory. The slot script
      # lives in the repo, so acquiring before the checkout reaches for a file
      # that does not exist yet — every job failed 127 that way. And this job
      # alone checks out to `foundryx-source`, so the path other jobs use is
      # never present here at all.
      - name: acquire the machine-wide mac build slot
        run: bash "$GITHUB_WORKSPACE/foundryx-source/ci/mac-slot.sh" acquire "foundryx-ios-publish/build-sign-ship"
      - uses: actions/checkout@v4
        with:
          repository: GoForgeIt/forge-design-system
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: grain
      - uses: actions/checkout@v4
        with:
          repository: MarkDucommun/brine-private
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          path: brine-private-source
      - name: archive + rcodesign + TestFlight (verified installable)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          FOUNDRYX_PROVISION_PROFILE_BASE64: ${{ secrets.FOUNDRYX_PROVISION_PROFILE_BASE64 }}
          FOUNDRYX_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.FOUNDRYX_WIDGET_PROVISION_PROFILE_BASE64 }}
          FOUNDRYX_SIGNING_PEM: ${{ secrets.FOUNDRYX_SIGNING_PEM }}
        run: bash foundryx-source/scripts/ci/archive-sign-upload.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FoundryX-ipa
          path: ipa-out/FoundryX.ipa
          retention-days: 14
      # `if: always()`, so a failed or refused build hands its slot back at once
      # instead of waiting for its Runner.Worker pid to disappear.
      - name: release the machine-wide mac build slot
        if: always()
        run: bash "$GITHUB_WORKSPACE/foundryx-source/ci/mac-slot.sh" release
