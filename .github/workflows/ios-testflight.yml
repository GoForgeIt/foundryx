name: iOS TestFlight

# Auto-deploy to TestFlight on push to main (app-relevant changes) + on demand.
# Reuses scripts/ship-ios.sh — the SAME rcodesign flow that signs locally, so CI and
# local ship behave identically and the widget extension is signed correctly. A clean
# GitHub macOS runner is unaffected by the macOS-beta codesign bug that forces rcodesign
# locally, but rcodesign is version-agnostic so we use it in both places.
#
# Requires repo secrets — see .github/CI-SECRETS-ios.md.

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'App/**'
      - 'Widget/**'
      - 'project.yml'
      - 'scripts/ship-ios.sh'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ship-ios.sh build number = git rev-list --count HEAD

      - name: Install xcodegen + rcodesign
        run: |
          brew install xcodegen
          cargo install apple-codesign --version 0.29.0 --locked
          ~/.cargo/bin/rcodesign --version

      - name: Restore signing assets from secrets
        env:
          DIST_KEY_B64:       ${{ secrets.APPLE_DIST_KEY_B64 }}
          DIST_CERT_B64:      ${{ secrets.APPLE_DIST_CERT_B64 }}
          WWDR_G3_B64:        ${{ secrets.APPLE_WWDR_G3_B64 }}
          APP_PROFILE_B64:    ${{ secrets.FOUNDRYX_APP_PROFILE_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.FOUNDRYX_WIDGET_PROFILE_B64 }}
          ASC_KEY_B64:        ${{ secrets.ASC_API_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p build/signing ~/.appstoreconnect/private_keys
          echo "$DIST_KEY_B64"       | base64 -d > build/signing/dist.key
          echo "$DIST_CERT_B64"      | base64 -d > build/signing/dist.pem
          echo "$WWDR_G3_B64"        | base64 -d > build/signing/AppleWWDRCAG3.cer
          echo "$APP_PROFILE_B64"    | base64 -d > build/signing/FoundryX_AppStore.mobileprovision
          echo "$WIDGET_PROFILE_B64" | base64 -d > build/signing/FoundryX_Widget_AppStore.mobileprovision
          echo "$ASC_KEY_B64"        | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_TY9TX3FBAD.p8

      - name: Build + sign (app + widget) + upload to TestFlight
        run: bash scripts/ship-ios.sh
