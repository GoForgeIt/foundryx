name: FoundryX
options:
  bundleIdPrefix: com.goforgeit
  deploymentTarget:
    iOS: "16.0"
targets:
  FoundryX:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/FoundryXKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FoundryX
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
