name: FoundryX
options:
  bundleIdPrefix: com.goforgeit
  deploymentTarget:
    iOS: "16.0"
# PerfRelease = Release + the PERF_HARNESS compilation condition on the APP target
# only (see FoundryX target configs). sim-perf.sh builds this so perf budgets measure
# OPTIMIZED code while the DEBUG-gated harness hooks (-StressSeed/-PerfLog/watchdog)
# stay available. A config (not a CLI SWIFT_ACTIVE_COMPILATION_CONDITIONS override)
# because the CLI override leaks into SPM packages and breaks swift-crypto's flags.
configs:
  Debug: debug
  Release: release
  PerfRelease: release
packages:
  Grain:
    path: ../grain/platforms/grain-swift
  BlakeHash:
    url: https://github.com/trancee/blake-hash.git
    exactVersion: 1.1.1
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0
  # This repo's own SPM package — exposes the FoundryXKit library product so the
  # iOS-simulator test target can `import FoundryXKit` (the same sources the app
  # inlines) built for the iOS runtime, where FoundationModels/MetricKit live.
  FoundryXKitPackage:
    path: .
  # The generic Swift Brine runner (Foundation-only; now iOS-declared) — the
  # BrineSwiftCore product the scenario/step tests drive.
  BrineSwift:
    path: ../brine-private/runners/implementations/swift
targets:
  FoundryX:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/FoundryXKit
      - Resources
      # The interactive Live Activity App Intents + broker are SHARED with the widget
      # extension: the widget attaches them to buttons, the APP performs them (a
      # LiveActivityIntent runs in the app process, where it wires to CaptureManager).
      - path: Widget/CaptureIntents.swift
    dependencies:
      - package: Grain
        product: Grain
      - package: BlakeHash
        product: BlakeHash
      - package: WhisperKit
        product: WhisperKit
      # Embed the widget extension into the app bundle (Live Activity + WidgetKit).
      - target: FoundryXWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Solleva
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Opt the app into Live Activities (ActivityKit). Required for
        # Activity.request to succeed.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        # iPhone = portrait; iPad = all four (App Store requires every
        # orientation for iPad multitasking unless the app is full-screen-only).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: FoundryX connects to your Foundry door running on your computer over the local network.
        NSBluetoothAlwaysUsageDescription: FoundryX connects to your Omi wearable over Bluetooth to capture audio.
        NSMicrophoneUsageDescription: FoundryX records conversations using your phone's microphone (when your Omi isn't connected) and captures audio from your Omi wearable. Audio stays on your devices.
        NSSpeechRecognitionUsageDescription: FoundryX shows a live, on-device transcript preview as you speak. Speech recognition runs entirely on your phone and the text stays on your devices.
        NSLocationWhenInUseUsageDescription: FoundryX notes where a conversation took place so each capture shows its location. Location is sampled only while you're using the app and stays on your devices.
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSAppTransportSecurity:
          # SCOPED, not app-wide. `NSAllowsArbitraryLoads: true` removed the
          # encryption floor from EVERY request the app makes, so no other call
          # was protected and no future one could be.
          #
          # The exception now covers ONLY the raw Noise relay on :8787. The
          # gateway — the leg that carried the sign-in id_token — moved to
          # https://gateway.goforgeit.com, so the credential no longer crosses
          # the wire in the clear. :8787 carries no token and its payload is
          # already E2E-encrypted by Noise.
          #
          # This does NOT make the relay leg safe — the sign-in id_token still
          # crosses it in plaintext. It removes the blast radius from every other
          # endpoint while the relay gets a hostname + certificate.
          #
          # NSAllowsArbitraryLoads is deliberately ABSENT: iOS ignores granular
          # keys when it is present, so leaving it would silently defeat this.
          NSExceptionDomains:
            "34.57.104.157":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        # M5 R1b remote sign-in (Google/Microsoft) → designated desktop host.
        # Google = the iOS-type OAuth client (PKCE, no secret); Microsoft = Entra
        # app b0b93eb1 with the mobile redirect msauth.<bundle>://auth. Both work
        # on the phone.
        FoundryXOAuth:
          GoogleIOSClientID: "449450484577-vvrkjs9hkbp5t5rgju6td29r1762hoei.apps.googleusercontent.com"
          MicrosoftClientID: "b0b93eb1-413e-41e5-8a90-5e991e113b62"
          MicrosoftTenant: organizations
          # TLS via a Cloudflare tunnel to the relay VM (2026-08-02). This is the
          # leg that carried the sign-in id_token in the clear — `HostResolver`
          # sends `Authorization: Bearer <id_token>` here, so anyone sharing a
          # network could lift it. The origin is now loopback-only behind the
          # tunnel; there is no bare-IP endpoint to intercept.
          GatewayHTTPURL: "https://gateway.goforgeit.com"
          # STILL PLAINTEXT, deliberately and narrowly: :8787 speaks a raw Noise
          # protocol, not HTTP, so it cannot ride the tunnel. It carries no
          # id_token and its payload is already E2E-encrypted by Noise — the
          # exposure is metadata, not the credential. Tracked, not forgotten.
          RelayWSURL: "ws://34.57.104.157:8787"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.449450484577-vvrkjs9hkbp5t5rgju6td29r1762hoei
              - msauth.com.goforgeit.foundryx
              - foundryx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx
        MARKETING_VERSION: "2.42.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ND7H73W8VZ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Group: the shared container the app writes + the widget reads (capture
        # status snapshot). The widget target carries the matching entitlement.
        CODE_SIGN_ENTITLEMENTS: App/FoundryX.entitlements
      configs:
        Debug:
          # Simulator/dev builds stay creds-free (no signing identity required).
          CODE_SIGNING_ALLOWED: NO
        Release:
          # Device/archive (TestFlight) signs via the team + automatic provisioning.
          CODE_SIGNING_ALLOWED: YES
        PerfRelease:
          # sim-perf harness: optimized build with the harness hooks compiled in.
          CODE_SIGNING_ALLOWED: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PERF_HARNESS

  # iOS-simulator test target: runs the existing Brine scenario/step + FoundryXKit
  # unit suite (Tests/FoundryXBrineTests) on the iOS runtime — NOT just macOS via
  # `swift test`. Hostless logic tests (no app launch): they instantiate FoundryXKit
  # types and assert on models, so they need no test host. This is what lets us catch
  # iOS-only regressions (FoundationModels titling, MetricKit, on-device paths) and
  # add perf assertions that run on a chosen simulated iPhone via -destination.
  # NB: NOT named "FoundryXBrineTests" — that's the SPM package's own test target
  # (dragged in transitively by the `path: .` package), and two same-named modules
  # both synthesize `Bundle.module`, colliding on fixture lookup. A distinct name
  # keeps the resource accessor unambiguous.
  FoundryXiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/FoundryXBrineTests
    dependencies:
      - package: FoundryXKitPackage
        product: FoundryXKit
      - package: BrineSwift
        product: BrineSwiftCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        # Fixtures (handshake vectors, omi frames) are copied into the bundle so
        # Bundle.module-style lookups resolve on-device like they do under SPM.
        TARGETED_DEVICE_FAMILY: "1,2"

  # ---------------------------------------------------------------- THE APP-HOSTED SCENARIO LANE
  # The gap `FoundryXiOSTests` above CANNOT close, by construction.
  #
  # That target's sources are `Tests/FoundryXBrineTests` and its only code dependency is the
  # FoundryXKit LIBRARY. It cannot import `App/`. So every scenario it runs asserts against an
  # object graph the TEST assembled — and passes identically whether or not the shipping app
  # ever reaches that graph. The audit behind this target sampled 17 `*FeatureTests.swift`
  # files across capture/chat/account/pocket/vault/device/sync/onboarding/search: 17 of 17
  # hand-build the seam, 0 of 17 drive a production entry point, and 0 of 17 assert app
  # reachability by EXECUTING app code. Seven of the 73 feature suites hold an App-side fact
  # at all, and all seven hold it by SCANNING App SOURCE AS TEXT (`AppSourceTree`), which by
  # its own stated limits cannot see `#if`, dead branches, or whether a call is on a live path.
  #
  # The failure mode is not hypothetical and is not historical: `RecordingDeviceAdoption
  # .remember` and `PocketBLEClient.download` each shipped fully implemented, fully
  # scenario-covered, and with no caller in `App/` at all. The tests were green the whole time.
  # The app was also configured differently from the tests — `App/DeviceScreen.swift` builds
  # `RecordingDeviceAttachment()` with the zero-argument production init while the suites build
  # it with five injected seams, so the object under test was never the object that ships.
  #
  # THIS TARGET IS HOSTED BY THE REAL APP. `TEST_HOST` is `FoundryX.app`, so the bundle is
  # injected into the shipping application's process on the simulator and `@testable import
  # FoundryX` reaches the app module — `App/` and `Sources/FoundryXKit` both, exactly as the
  # app compiles them. Scenarios here render the app's OWN SwiftUI screens through
  # `AppScreenProbe` and read back the real accessibility tree. Deleting a call site in `App/`
  # therefore turns a scenario RED, which is the entire point: a test that passes whether or
  # not the app is wired is not a test of the app.
  #
  # It is deliberately a SECOND target rather than a conversion of the first. Hosted tests pay
  # a full app launch per bundle and cannot run hostless; making all 239 files pay that would
  # buy nothing for the ones that genuinely test kit logic. This is the lane for the claims
  # that are about the APPLICATION.
  FoundryXAppScenarioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/FoundryXAppScenarioTests
      # THE SAME SCRIPTED RADIO THE HOSTLESS SUITE USES, NOT A SECOND ONE. A fake written
      # twice is two ideas of what a recorder does, and the scenario that matters here is
      # whether the APP reaches the shipped code — which is only worth asserting if the
      # thing underneath it is the fake the rest of the suite already trusts. It carries an
      # `#if APP_HOSTED_SCENARIOS` import shim because the module the kit types live in
      # differs between the two lanes: `FoundryXKit` under SPM, the app module here.
      - path: Tests/FoundryXBrineTests/FakePocketBluetoothStack.swift
      # The one Brine driver, shared for the same reason: a second one is a second idea of
      # what "the scenario passed" means. It imports no kit module, so it needs no shim.
      - path: Tests/FoundryXBrineTests/BrineFeatureRunner.swift
      # THE RECORDER'S OWN AUDIO, carried as a bundle RESOURCE. The app's bring-over now
      # DECODES what it pulled, so these scenarios need real MPEG-2 Layer III rather than two
      # bytes that satisfy a sync-word check — and this lane runs inside the shipping app on a
      # simulator, where the repository is not reachable by `#filePath` the way it is for the
      # hostless suite. Same file the hostless suite reads; see its POCKET-AUDIO-PROVENANCE.txt.
      - path: Tests/FoundryXBrineTests/fixtures/pocket/pocket-fw16-3s.mp3
        buildPhase: resources
    dependencies:
      # The APP target — not the FoundryXKit package. Depending on both would put two copies
      # of every kit type in the process (one compiled into the app, one in the library) and
      # `@testable import` would resolve to the copy the app is NOT running.
      - target: FoundryX
      - package: BrineSwift
        product: BrineSwiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx.app-scenario-tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FoundryX.app/FoundryX"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Selects `@testable import FoundryX` over `@testable import FoundryXKit` in the
        # shared BLE fake — see the shim at the top of FakePocketBluetoothStack.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG APP_HOSTED_SCENARIOS"

  # Minimal app host for the one proof that must exercise the real iOS Keychain.
  # It is deliberately separate from FoundryX and the hostless logic suite: the
  # signed simulator lane below proves Security.framework behavior without
  # launching production services or making every unit test app-hosted.
  PairingKeychainTestHost:
    type: application
    platform: iOS
    sources:
      - TestSupport/PairingKeychainTestHost
    info:
      path: TestSupport/PairingKeychainTestHost/Info.plist
      properties:
        CFBundleDisplayName: Pairing Keychain Test Host
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx.pairing-keychain-test-host
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  PairingKeychainIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PairingKeychainIntegrationTests
    dependencies:
      - target: PairingKeychainTestHost
      - package: FoundryXKitPackage
        product: FoundryXKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx.pairing-keychain-tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PairingKeychainTestHost.app/PairingKeychainTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"

  # UI-proof lane (track 20260715T1500 addendum): XCUITests that drive the REAL
  # app through the demo-seeded screens (`-MainPreview`) by accessibility
  # identifier and attach screenshots — the simulator proof for interaction
  # tracks (the Actions-face options flow first). Run via the FoundryXUIProof
  # scheme; screenshots land in the .xcresult bundle.
  FoundryXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: FoundryX
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: FoundryX
        TARGETED_DEVICE_FAMILY: "1,2"

  # Widget extension: the home/lock-screen "Capture Status" widget + the capture Live
  # Activity (Dynamic Island). Shares CaptureActivityAttributes + CaptureWidgetSnapshot
  # with the app by compiling those two source files into BOTH targets (the Xcode build
  # has no FoundryXKit module — the app compiles Sources/FoundryXKit directly), and reads
  # live state over the App Group.
  FoundryXWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Sources/FoundryXKit/CaptureActivityAttributes.swift
      - path: Sources/FoundryXKit/CaptureWidgetSnapshot.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Solleva
        # Track the app's build number AND version string (ship-ios.sh overrides
        # CURRENT_PROJECT_VERSION on the command line for BOTH targets) — a
        # mismatch draws an App Store Connect 90473 warning on every upload.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx.widget
        PRODUCT_NAME: FoundryXWidget
        MARKETING_VERSION: "2.42.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ND7H73W8VZ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/FoundryXWidget.entitlements
        # SwiftUI widgets need a deployment floor where WidgetKit exists; 16.0 matches
        # the app. The Live Activity widget inside is @available(iOS 16.1)-gated.
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES

schemes:
  # The app's own scheme — explicit because DECLARING any scheme below stops
  # xcodegen auto-generating per-target schemes, and the build/perf/ship
  # scripts (`sim-perf.sh`, `ship-ios.sh`, CI) all call `-scheme FoundryX`.
  FoundryX:
    build:
      targets:
        FoundryX: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - FoundryXiOSTests

  # The simulator interaction-proof scheme: builds the app + UI tests and runs
  # the XCUITest proof flows (screenshots attach to the .xcresult).
  FoundryXUIProof:
    build:
      targets:
        FoundryX: all
        FoundryXUITests: all
    test:
      config: Debug
      targets:
        - FoundryXUITests

  # The app-hosted scenario lane: builds the REAL app and runs the scenarios that
  # claim things about it inside its own process. See the target comment above for
  # why this cannot be folded into the FoundryX scheme's hostless test action.
  FoundryXAppScenarios:
    build:
      targets:
        FoundryX: all
        FoundryXAppScenarioTests: all
    test:
      config: Debug
      targets:
        - FoundryXAppScenarioTests

  FoundryXKeychainProof:
    build:
      targets:
        PairingKeychainTestHost: all
    test:
      config: Debug
      targets:
        - PairingKeychainIntegrationTests
