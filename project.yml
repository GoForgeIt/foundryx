name: FoundryX
options:
  bundleIdPrefix: com.goforgeit
  deploymentTarget:
    iOS: "16.0"
packages:
  Grain:
    path: ../grain/platforms/grain-swift
  BlakeHash:
    url: https://github.com/trancee/blake-hash.git
    exactVersion: 1.1.1
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0
targets:
  FoundryX:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/FoundryXKit
      - Resources
      # The interactive Live Activity App Intents + broker are SHARED with the widget
      # extension: the widget attaches them to buttons, the APP performs them (a
      # LiveActivityIntent runs in the app process, where it wires to CaptureManager).
      - path: Widget/CaptureIntents.swift
    dependencies:
      - package: Grain
        product: Grain
      - package: BlakeHash
        product: BlakeHash
      - package: WhisperKit
        product: WhisperKit
      # Embed the widget extension into the app bundle (Live Activity + WidgetKit).
      - target: FoundryXWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FoundryX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Opt the app into Live Activities (ActivityKit). Required for
        # Activity.request to succeed.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        # iPhone = portrait; iPad = all four (App Store requires every
        # orientation for iPad multitasking unless the app is full-screen-only).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: FoundryX connects to your Foundry door running on your computer over the local network.
        NSBluetoothAlwaysUsageDescription: FoundryX connects to your Omi wearable over Bluetooth to capture audio.
        NSMicrophoneUsageDescription: FoundryX records conversations using your phone's microphone (when your Omi isn't connected) and captures audio from your Omi wearable. Audio stays on your devices.
        NSSpeechRecognitionUsageDescription: FoundryX shows a live, on-device transcript preview as you speak. Speech recognition runs entirely on your phone and the text stays on your devices.
        NSLocationWhenInUseUsageDescription: FoundryX notes where a conversation took place so each capture shows its location. Location is sampled only while you're using the app and stays on your devices.
        UIBackgroundModes:
          - bluetooth-central
          - audio
        NSAppTransportSecurity:
          # NOTE: NSAllowsArbitraryLoads MUST be the only key here — iOS 10+ IGNORES
          # it if NSAllowsLocalNetworking (or other granular keys) is also present.
          # The app is remote-only (relay), so LAN-networking allowance isn't needed.
          # The hosted relay/gateway is a raw-IP http/ws endpoint (no domain/cert
          # yet); door traffic is already E2E-encrypted by the Noise tunnel. TODO:
          # domain + TLS (wss/https) on the relay, then scope to a per-host exception.
          NSAllowsArbitraryLoads: true
        # M5 R1b remote sign-in (Google/Microsoft) → designated desktop host.
        # Google = the iOS-type OAuth client (PKCE, no secret); Microsoft = Entra
        # app b0b93eb1 with the mobile redirect msauth.<bundle>://auth. Both work
        # on the phone.
        FoundryXOAuth:
          GoogleIOSClientID: "449450484577-vvrkjs9hkbp5t5rgju6td29r1762hoei.apps.googleusercontent.com"
          MicrosoftClientID: "b0b93eb1-413e-41e5-8a90-5e991e113b62"
          MicrosoftTenant: organizations
          GatewayHTTPURL: "http://34.57.104.157:8788"
          RelayWSURL: "ws://34.57.104.157:8787"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.449450484577-vvrkjs9hkbp5t5rgju6td29r1762hoei
              - msauth.com.goforgeit.foundryx
              - foundryx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx
        MARKETING_VERSION: "2.42.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ND7H73W8VZ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Group: the shared container the app writes + the widget reads (capture
        # status snapshot). The widget target carries the matching entitlement.
        CODE_SIGN_ENTITLEMENTS: App/FoundryX.entitlements
      configs:
        Debug:
          # Simulator/dev builds stay creds-free (no signing identity required).
          CODE_SIGNING_ALLOWED: NO
        Release:
          # Device/archive (TestFlight) signs via the team + automatic provisioning.
          CODE_SIGNING_ALLOWED: YES

  # Widget extension: the home/lock-screen "Capture Status" widget + the capture Live
  # Activity (Dynamic Island). Shares CaptureActivityAttributes + CaptureWidgetSnapshot
  # with the app by compiling those two source files into BOTH targets (the Xcode build
  # has no FoundryXKit module — the app compiles Sources/FoundryXKit directly), and reads
  # live state over the App Group.
  FoundryXWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Sources/FoundryXKit/CaptureActivityAttributes.swift
      - path: Sources/FoundryXKit/CaptureWidgetSnapshot.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FoundryX
        # Track the app's build number AND version string (ship-ios.sh overrides
        # CURRENT_PROJECT_VERSION on the command line for BOTH targets) — a
        # mismatch draws an App Store Connect 90473 warning on every upload.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goforgeit.foundryx.widget
        PRODUCT_NAME: FoundryXWidget
        MARKETING_VERSION: "2.42.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ND7H73W8VZ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/FoundryXWidget.entitlements
        # SwiftUI widgets need a deployment floor where WidgetKit exists; 16.0 matches
        # the app. The Live Activity widget inside is @available(iOS 16.1)-gated.
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
